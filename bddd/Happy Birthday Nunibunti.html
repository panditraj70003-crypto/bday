<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Nunibunti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e3f7;--ink:#3b1f4a;--pink:#ee4f98;--leaf:#2f8a4b;--card:#fff7fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1636;--ink:#fbe9f4;--pink:#ff6fb0;--leaf:#6fd08a;--card:#3a2049}}
:root[data-theme="dark"]{--bg:#2a1636;--ink:#fbe9f4;--pink:#ff6fb0;--leaf:#6fd08a;--card:#3a2049}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px;text-align:center;position:relative;z-index:1}
.hb{font-size:1.25rem;font-weight:500;letter-spacing:.02em;margin:0 0 2px}
.name{font-family:'Pacifico',cursive;font-size:clamp(3rem,15vw,5rem);line-height:1.1;margin:0;color:var(--pink);transform:rotate(-3deg);display:inline-block}
.frame{width:min(78vw,340px);aspect-ratio:4/5;margin:26px auto 22px;border-radius:999px 999px 28px 28px;overflow:hidden;border:7px solid var(--card);box-shadow:10px 10px 0 var(--pink);background:var(--card)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.msg{background:var(--card);border-radius:22px;padding:20px 22px;font-size:1.1rem;line-height:1.6;border-left:6px solid var(--leaf)}
.msg p{margin:0 0 .6em}.msg p:last-child{margin:0}
button{margin-top:22px;font:inherit;font-weight:600;font-size:1.05rem;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:13px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.c{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.c{display:none}}
</style></head>

const COLORS=["#ee4f98","#f7c948","#2f8a4b","#8e5bd6","#ff8a5c","#4cc3e8"];
function Confetti({burst}){
  const [bits,setBits]=useState([]);
  useEffect(()=>{
    const b=Array.from({length:60},(_,i)=>({id:burst+"-"+i,left:Math.random()*100,delay:Math.random()*1.2,dur:2.6+Math.random()*2.4,color:COLORS[i%COLORS.length]}));
    setBits(b);const t=setTimeout(()=>setBits([]),6500);return()=>clearTimeout(t);
  },[burst]);
  return h(React.Fragment,null,bits.map(b=>h("span",{key:b.id,className:"c",style:{left:b.left+"%",background:b.color,animationDuration:b.dur+"s",animationDelay:b.delay+"s"}})));
}
function App(){
  const [burst,setBurst]=useState(0);
  return h("div",{className:"wrap"},
    h(Confetti,{burst}),
    h("p",{className:"hb"},"Happy Birthday"),
    h("h1",{className:"name"},"Nunibunti"),
    h("div",{className:"frame"},h("img",{src:PHOTO,alt:"Nunibunti"})),
    h("div",{className:"msg"},
      h("p",null,"Wishing you a day full of laughter, cake and everything you love."),
      h("p",null,"May this year bring you big dreams, good health and lots of happiness. I'm so glad you're my sister!")),
    h("button",{onClick:()=>setBurst(n=>n+1)},"Throw confetti"));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script></body></html>
